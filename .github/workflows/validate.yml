name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint (Biome)
        id: lint
        run: npx @biomejs/biome check --reporter=github .

      - name: Run tests with coverage
        id: tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

      - name: Build packages
        id: build
        run: npm run build:all

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Validation summary"
            echo ""
            echo "- event: \`${{ github.event_name }}\`"
            echo "- ref: \`${{ github.ref_name }}\`"
            echo "- node: \`${{ matrix.node-version }}\`"
            echo "- package: \`$(node -p "require('./package.json').name")\`"
            echo "- install: \`${{ steps.install.outcome || 'skipped' }}\`"
            echo "- lint: \`${{ steps.lint.outcome || 'skipped' }}\`"
            echo "- tests: \`${{ steps.tests.outcome || 'skipped' }}\`"
            echo "- build: \`${{ steps.build.outcome || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
