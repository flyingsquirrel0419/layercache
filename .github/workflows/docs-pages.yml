name: Docs Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-web/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-web
        run: npm ci

      - name: Build docs
        working-directory: docs-web
        env:
          GITHUB_PAGES: "true"
          CUSTOM_DOMAIN: layercache.flyingsquirrel.me
          GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
          SITE_URL: https://layercache.flyingsquirrel.me
        run: npm run build

      - name: Write Pages metadata
        working-directory: docs-web
        env:
          CUSTOM_DOMAIN: layercache.flyingsquirrel.me
          SITE_URL: https://layercache.flyingsquirrel.me
        run: |
          set -eu

          default_site_url="https://flyingsquirrel0419.github.io/layercache"
          if [ -n "${CUSTOM_DOMAIN:-}" ]; then
            clean_domain="${CUSTOM_DOMAIN#http://}"
            clean_domain="${clean_domain#https://}"
            clean_domain="${clean_domain%/}"
            printf '%s\n' "${clean_domain}" > doc_build/CNAME
            site_url="https://${clean_domain}"
          else
            site_url="${default_site_url}"
          fi

          if [ -n "${SITE_URL:-}" ]; then
            site_url="${SITE_URL%/}"
          fi

          {
            printf '%s\n' '# Layercache robots.txt'
            printf '%s\n' '# Content Signals (https://contentsignals.org, draft-romm-aipref-contentsignals)'
            printf '%s\n' '# Declares preferences for how this site'\''s public content may be used.'
            printf '%s\n' 'Content-Signal: search=yes, ai-input=yes, ai-train=no'
            printf '\n'
            printf '%s\n' 'User-agent: *'
            printf '%s\n' 'Allow: /'
            printf '\n'
            printf 'Sitemap: %s/sitemap.xml\n' "${site_url}"
          } > doc_build/robots.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-web/doc_build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
